services:
  - type: web
    name: autoroll-license
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: autoroll-db
          property: connectionString
      - key: CLIENT_SECRET
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: OWNER_IDS
        sync: false
      - key: KEY_DELIVERY
        value: oauth
      - key: CLIENT_SIGN_REQUIRED
        value: "1"
      - key: OFFLINE_GRACE_HOURS
        value: "24"

databases:
  # Внимание: бесплатный Postgres на Render живёт 30 дней.
  - name: autoroll-db
    plan: free
    databaseName: autoroll
    user: autoroll
